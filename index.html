<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>안녕, 세상! — 박지성의 자기소개</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
      background: radial-gradient(circle at 50% 0%, #1e293b 0%, var(--bg) 60%);
      color: var(--text);
    }

    .card {
      width: 100%;
      max-width: 640px;
      padding: 3.5rem 2.5rem;
      text-align: center;
      background: var(--card);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      animation: rise 0.7s ease-out;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: clamp(2.75rem, 9vw, 5rem);
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(120deg, var(--accent), #a78bfa 70%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1.5rem;
    }

    .name {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }

    .name span { color: var(--accent); }

    p.bio {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.7;
    }

    .divider {
      width: 56px;
      height: 4px;
      margin: 2rem auto;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), #a78bfa);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>안녕, 세상!</h1>
    <div class="divider"></div>
    <p class="name">저는 <span>박지성</span>입니다</p>
    <p class="bio">
      반갑습니다! 새로운 것을 배우고 만드는 걸 좋아하는 박지성입니다.<br />
      이 페이지는 저의 첫 번째 자기소개 페이지예요. 😊
    </p>
  </main>
</body>
</html>
